ukf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: /wheel_odom
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false, false, false, false]
    odom0_differential: false
    odom0_queue_size: 20
    # robot_localization rotates tilted IMU angular velocity using its TF.
    # No absolute yaw, orientation or acceleration fusion in this planar setup.
    imu0: /livox/imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true, false, false, false]
    imu0_differential: false
    imu0_queue_size: 100
    alpha: 0.001
    kappa: 0.0
    beta: 2.0
