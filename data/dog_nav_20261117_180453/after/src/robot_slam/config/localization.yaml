open3d_localizer:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    cloud_topic: /slam/body_cloud
    fastlio_odom_topic: /fastlio/base_odom
    dog_odom_topic: /odom
    auto_initialize_from_origin: true
    persist_last_pose: false
    restore_last_pose: false
    pose_cache_path: ~/.local/share/baobao/last_localization_pose.txt
    auto_initial_x: 0.0
    auto_initial_y: 0.0
    auto_initial_z: 0.0
    auto_initial_roll: 0.0
    auto_initial_pitch: 0.0
    auto_initial_yaw: 0.0
    layer_base_z: 0.0
    layer_z_tolerance: 0.0
    planar_navigation_tf: true
    window_duration_sec: 1.2
    dog_odom_buffer_duration_sec: 5.0
    max_dog_odom_interpolation_gap_sec: 0.2
    max_cloud_age_sec: 0.8
    registration_rate_hz: 2.0
    tracking_fine_only: true
    tf_rate_hz: 30.0
    coarse_voxel_size: 0.25
    fine_voxel_size: 0.12
    coarse_max_correspondence: 1.5
    fine_max_correspondence: 0.6
    normal_radius: 0.5
    max_iterations_coarse: 30
    max_iterations_fine: 20
    min_source_points: 250
    min_inliers: 150
    min_fitness: 0.3
    max_inlier_rmse: 0.45
    max_tracking_translation_correction: 1.2
    max_tracking_rotation_correction_rad: 0.25
    max_localizing_translation_correction: 2.5
    max_localizing_rotation_correction_rad: 0.8
    local_map_radius_xy: 10.0
    local_map_half_height: 3.0
    map_tile_size: 4.0
    max_condition_number: 1000000.0
    min_information_eigenvalue: 0.0001
    robust_kernel_scale: 0.35
    immediate_tracking_translation: 0.1
    immediate_tracking_rotation_rad: 0.05
    correction_confirmation_translation: 0.08
    correction_confirmation_rotation_rad: 0.04
    large_correction_confirmations: 3
    override_initial_base_z: false
    initial_base_z: 0.0
    successes_to_track: 3
    failures_to_lose: 5
    tracking_smoothing_alpha: 0.25
    max_tf_translation_rate_mps: 0.25
    max_tf_rotation_rate_radps: 0.2
    max_reasonable_translation: 100.0
    max_fastlio_pose_jump_translation: 2.0
    max_fastlio_pose_jump_rotation_rad: 0.5
