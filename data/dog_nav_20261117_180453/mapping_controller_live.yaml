/controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    FollowPath:
      CachedObstacleFootprint:
        class: CachedObstacleFootprint
        scale: 1.25
        sum_scores: false
      ForwardProgress:
        class: ForwardProgress
        goal_distance_threshold: 0.3
        heading_error_threshold: 0.7
        lookahead_distance: 0.4
        minimum_forward_speed: 0.21
        scale: 30.0
      GoalAlign:
        aggregation_type: last
        class: GoalAlign
        forward_point_distance: 0.15
        scale: 0.0
      GoalApproachMotion:
        class: GoalApproachMotion
        enable_distance: 0.3
        scale: 1.0
      GoalDist:
        aggregation_type: last
        class: GoalDist
        scale: 15.0
      LateralVelocity:
        class: LateralVelocity
        deadband: 0.03
        goal_distance_threshold: 0.3
        scale: 20.0
      Oscillation:
        class: Oscillation
        oscillation_reset_angle: 0.2
        oscillation_reset_dist: 0.05
        oscillation_reset_time: -1.0
        scale: 1.0
        x_only_threshold: 0.05
      PathAlign:
        aggregation_type: last
        class: PathAlign
        forward_point_distance: 0.3
        scale: 15.0
      PathDist:
        aggregation_type: last
        class: PathDist
        scale: 12.0
      RotateToPath:
        class: RotateToPath
        enter_angle: 0.6
        exit_angle: 0.25
        goal_change_tolerance: 0.1
        goal_distance_threshold: 0.3
        lookahead_distance: 0.4
        max_translation_speed: 0.0
        min_rotation_speed: 0.21
        scale: 1.0
      StableRotateToGoal:
        class: StableRotateToGoal
        enter_distance: 0.13
        exit_distance: 0.2
        goal_change_position_tolerance: 0.05
        goal_change_yaw_tolerance: 0.1
        max_rotation_speed: 0.6
        min_rotation_speed: 0.21
        position_tolerance: 0.15
        reposition_yaw_tolerance: 0.3
        scale: 18.0
        slowing_factor: 4.0
        yaw_tolerance: 0.15
      acc_lim_theta: 0.8
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      angular_granularity: 0.025
      bpx_startup_threshold: 0.21
      critics:
      - GoalApproachMotion
      - RotateToPath
      - StableRotateToGoal
      - Oscillation
      - CachedObstacleFootprint
      - ForwardProgress
      - LateralVelocity
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      debug_trajectory_details: false
      decel_lim_theta: -1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      default_critic_namespaces:
      - dwb_critics
      - dog_nav
      discretize_by_time: false
      forward_prune_distance: 2.0
      include_last_point: true
      limit_vel_cmd_in_traj: false
      linear_granularity: 0.05
      marker_lifetime: 0.1
      max_speed_xy: 0.3
      max_vel_theta: 0.6
      max_vel_x: 0.3
      max_vel_y: 0.0
      min_speed_theta: 0.21
      min_speed_xy: 0.0
      min_vel_x: 0.0
      min_vel_y: 0.0
      plugin: dog_nav::ParallelDwbLocalPlanner
      prune_distance: 0.5
      prune_plan: true
      publish_cost_grid_pc: false
      publish_evaluation: false
      publish_global_plan: true
      publish_local_plan: true
      publish_trajectories: false
      publish_transformed_plan: true
      short_circuit_trajectory_evaluation: true
      shorten_transformed_plan: true
      sim_time: 1.3
      time_granularity: 0.5
      trajectory_generator_name: dog_nav::BpxTrajectoryGenerator
      trans_stopped_velocity: 0.08
      transform_tolerance: 0.5
      vtheta_samples: 13
      vx_samples: 10
      vy_samples: 1
    controller_frequency: 15.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: false
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.005
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    odom_topic: /odom
    progress_checker:
      movement_time_allowance: 15.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
    progress_checker_plugin: progress_checker
    publish_zero_velocity: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    speed_limit_topic: speed_limit
    use_sim_time: true

